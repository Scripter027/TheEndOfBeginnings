<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The End of Beginnings</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --neon-green: #33ff33;
            --dark-green: #002200;
            --bright-green: #88ff88;
            --neon-red: #ff3333;
            --dark-red: #220000;
            --glow-green: 0 0 10px rgba(51, 255, 51, 0.4);
            --glow-red: 0 0 10px rgba(255, 51, 51, 0.4);
            --glass-glare: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(0, 0, 0, 0.4) 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            background-color: #000000; color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            height: 100%; width: 100%; overflow: hidden;
            position: relative; text-shadow: var(--glow-green);
            transition: color 0.1s ease;
        }
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), var(--glass-glare);
            z-index: 999; background-size: 100% 4px, 100% 100%; pointer-events: none;
        }
        body.wrong-flash { color: var(--neon-red) !important; text-shadow: var(--glow-red) !important; }
        body.wrong-flash::before {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), radial-gradient(circle at 50% 50%, rgba(255, 50, 50, 0.05) 0%, rgba(255, 50, 50, 0.01) 40%, rgba(0, 0, 0, 0.5) 100%) !important;
            background-size: 100% 4px, 100% 100%;
        }
        body.wrong-flash .terminal-input, body.wrong-flash .btn-submit, body.wrong-flash .timer-wrapper, body.wrong-flash .info-btn {
            border-color: var(--neon-red) !important; box-shadow: var(--glow-red) !important; color: var(--neon-red) !important;
        }
        body.wrong-flash a { color: var(--neon-red) !important; }
        .input-flash-active .terminal-input, .input-flash-active .btn-submit {
            background-color: rgba(51, 255, 51, 0.25) !important; border-color: var(--bright-green) !important;
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.9) !important; color: var(--bright-green) !important;
        }
        #boot-screen { display: none; position: absolute; top: 20px; left: 20px; font-size: 13px; line-height: 1.4; z-index: 10; font-weight: bold; max-width: 90%; height: 90%; overflow: hidden; }
        #main-container { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; padding: 20px; position: relative; z-index: 5; }
        .timer-wrapper { position: absolute; top: 6%; left: 50%; transform: translateX(-50%); text-align: center; cursor: pointer; padding: 10px 20px; border: 2px solid var(--neon-green); box-shadow: var(--glow-green); background: rgba(0, 0, 0, 0.6); min-width: 240px; transition: all 0.15s ease; }
        .timer-title { font-size: 11px; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; display: none; }
        .timer { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .secret-active .timer-title { display: block; }
        .secret-active .timer { font-size: 32px; }
        .terminal-box { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 550px; padding: 10px; margin-top: 60px; }
        .terminal-output { min-height: 110px; margin-bottom: 25px; text-align: center; font-size: 18px; width: 100%; word-wrap: break-word; line-height: 1.5; text-transform: uppercase; }
        .input-group { display: flex; width: 100%; gap: 10px; }
        .terminal-input { flex: 1; background: rgba(0, 0, 0, 0.6); border: 2px solid var(--neon-green); padding: 14px; color: var(--neon-green); font-family: inherit; font-size: 16px; outline: none; box-shadow: var(--glow-green); border-radius: 0; transition: all 0.15s ease; -webkit-appearance: none; }
        .btn-submit { background: transparent; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 14px 24px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; outline: none; box-shadow: var(--glow-green); border-radius: 0; transition: all 0.15s ease; }
        .btn-submit:hover { background: var(--neon-green); color: #000000; text-shadow: none; }
        .info-btn { position: absolute; bottom: 20px; left: 20px; font-size: 18px; font-weight: bold; cursor: pointer; opacity: 0.6; padding: 5px 12px; border: 2px solid var(--neon-green); border-radius: 50%; box-shadow: var(--glow-green); transition: all 0.2s ease; }
        .info-btn:hover { opacity: 1; background: var(--neon-green); color: #000000; text-shadow: none; }
        .lang-switch { position: absolute; bottom: 20px; right: 20px; font-size: 15px; font-weight: bold; cursor: pointer; opacity: 0.6; padding: 5px 10px; transition: all 0.1s ease; }
        .lang-switch:hover { opacity: 1; }
        .lang-switch.rage-mode { color: var(--neon-red) !important; border: 1px dashed var(--neon-red); box-shadow: var(--glow-red); text-shadow: var(--glow-red); animation: pulse 0.5s infinite alternate; }
        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { border: 2px solid var(--neon-green); box-shadow: var(--glow-green); background: #000; padding: 25px; max-width: 600px; width: 100%; text-align: center; line-height: 1.6; font-size: 15px; white-space: pre-line; }
        .pwa-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; box-sizing: border-box; }
        .pwa-box { border: 2px solid var(--neon-green); padding: 20px; box-shadow: var(--glow-green); max-width: 450px; width: 100%; line-height: 1.6; font-size: 15px; }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
        a { color: var(--neon-green); text-decoration: underline; cursor: pointer; pointer-events: auto; }
        @media (max-width: 768px) { .timer-wrapper { min-width: 220px; padding: 8px 15px; } .timer { font-size: 22px; } .secret-active .timer { font-size: 28px; } .terminal-output { font-size: 17px; } .modal-content { font-size: 14px; } }
        @media (max-width: 480px) { #main-container { padding: 10px; } .timer-wrapper { top: 4%; width: 85%; min-width: 0; } .timer { font-size: 19px; } .secret-active .timer { font-size: 22px; } .terminal-box { margin-top: 80px; } .terminal-output { font-size: 15px; min-height: 120px; margin-bottom: 20px; } .input-group { flex-direction: column; gap: 8px; } .btn-submit { width: 100%; padding: 12px; } .terminal-input { padding: 12px; font-size: 15px; } .info-btn { bottom: 15px; left: 15px; } .lang-switch { bottom: 15px; right: 15px; } }
    </style>
</head>
<body>
    <div id="pwa-install-overlay" class="pwa-overlay">
        <div class="pwa-box">
            <p>Чтобы данный сайт работал вам нужно добавить его на экран домой.</p><br>
            <p>Нажмите на иконку меню (три точки или стрелка "Поделиться") в вашем браузере и выберите пункт "На экран 'Домой'" (или "Добавить на гл. экран").</p>
        </div>
    </div>
    <div id="main-container">
        <div id="terminal-zone">
            <div id="output-area"></div>
        </div>
        <div id="input-zone">
            <span id="prompt">></span>
            <input type="text" id="user-input" autofocus autocomplete="off" spellcheck="false">
            <button id="submit-btn" onclick="processTerminalInput()">ENTER</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="engine.js"></script>
    <script src="grid-manager.js"></script>
    <script src="desktop-view.js"></script>
    <script src="desktop-control.js"></script>
    <script src="messenger-logic.js"></script>
    <script src="search.js"></script>
    <script src="dino.js"></script>
    <script src="blockblast.js"></script>
    <script src="store.js"></script>
    <script src="tetris.js"></script>
</body>
</html>
