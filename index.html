<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPR MAIN TERMINAL</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000; color: #55ff55; font-family: 'Courier New', Courier, monospace !important; overflow: hidden; }
        #main-container { display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; padding: 20px; position: relative; background: #000000; }
        #main-container::before, #boot-screen::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(0, 0, 0, 0.4) 100%); z-index: 999; background-size: 100% 4px, 100% 100%; pointer-events: none; }
        #boot-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; z-index: 9999; padding: 20px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        #terminal-zone { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; margin-bottom: 75px; }
        #output-area { overflow-y: auto; max-height: 100%; display: flex; flex-direction: column; gap: 10px; padding-right: 10px; }
        .log-line { line-height: 1.4; white-space: pre-wrap; word-break: break-all; font-size: 16px; font-weight: bold; text-shadow: 0 0 10px rgba(85, 255, 85, 0.8); color: #55ff55; }
        .log-user { color: #88ff88; text-shadow: 0 0 10px rgba(136, 255, 136, 0.8); }
        .log-system { color: #55ff55; text-shadow: 0 0 10px rgba(85, 255, 85, 0.8); }
        .log-error { color: #ff3333; text-shadow: 0 0 12px rgba(255, 51, 51, 0.9); font-weight: bold; }
        #input-zone { display: flex; align-items: center; gap: 12px; background: rgba(0, 0, 0, 0.8); border: 2px solid #55ff55; padding: 14px; box-shadow: 0 0 20px rgba(85, 255, 85, 0.5); position: absolute; bottom: 20px; left: 20px; right: 20px; box-sizing: border-box; z-index: 100; }
        #prompt { font-weight: bold; font-size: 18px; color: #55ff55; text-shadow: 0 0 10px rgba(85, 255, 85, 0.8); }
        #user-input { flex: 1; background: transparent; border: none; color: #55ff55; font-family: inherit; font-size: 18px; font-weight: bold; outline: none; padding: 0; margin: 0; text-transform: uppercase; text-shadow: 0 0 10px rgba(85, 255, 85, 0.8); }
        #submit-btn { background: #55ff55; color: #000000; border: none; font-family: inherit; font-size: 14px; font-weight: bold; padding: 10px 24px; cursor: pointer; text-shadow: none; transition: all 0.15s ease; border-radius: 0; }
        #submit-btn:hover { background: #88ff88; box-shadow: 0 0 20px #55ff55; }
        #secret-timer-container { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 12px; z-index: 1000; font-weight: bold; text-shadow: 0 0 8px rgba(85, 255, 85, 0.6); }
        #lang-switch { position: absolute; top: 20px; left: 20px; background: transparent; border: 2px solid #55ff55; color: #55ff55; font-family: inherit; font-size: 12px; font-weight: bold; padding: 6px 12px; cursor: pointer; z-index: 1000; box-shadow: 0 0 15px rgba(85, 255, 85, 0.4); border-radius: 0; }
        #lang-switch:hover { background: #55ff55; color: #000000; text-shadow: none; }
    </style>
</head>
<body>
    <div id="boot-screen"></div>
    <button id="lang-switch" onclick="toggleSystemLanguage()">RU</button>
    <div id="secret-timer-container">
        <span id="secret-timer-label">UNTIL MOMENT X:</span>
        <div id="secret-timer" style="font-size: 16px; margin-top: 2px;">00:00:00:00</div>
    </div>
    <div id="main-container">
        <div id="terminal-zone">
            <div id="output-area"></div>
        </div>
        <div id="input-zone">
            <span id="prompt">></span>
            <input type="text" id="user-input" autofocus autocomplete="off" spellcheck="false">
            <button id="submit-btn" onclick="processTerminalInput()">ENTER</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="engine.js"></script>
    <script src="grid-manager.js"></script>
    <script src="desktop-view.js"></script>
    <script src="desktop-control.js"></script>
    <script src="messenger-logic.js"></script>
    <script src="search.js"></script>
    <script src="dino.js"></script>
    <script src="blockblast.js"></script>
    <script src="store.js"></script>
    <script src="tetris.js"></script>
</body>
</html>
